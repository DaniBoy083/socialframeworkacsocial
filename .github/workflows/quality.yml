name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm.cmd ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.lock.txt
      - run: npm.cmd run lint
      - run: npm.cmd run typecheck
      - run: npm.cmd run format:check
      - run: backend/.venv/Scripts/python.exe -m ruff check backend/app backend/scripts backend/tests
      - run: backend/.venv/Scripts/python.exe -m ruff format --check backend/app backend/scripts backend/tests
      - run: npm.cmd run test:backend
      - run: npm.cmd run build
      - run: npm.cmd exec playwright -- install chromium
      - run: npm.cmd test
      - run: npm.cmd audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
